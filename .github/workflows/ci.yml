name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    name: Quality (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '7.4'
          - '8.0'
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer


      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: PHPCS (WordPress + PHPCompatibility)
        run: composer lint

      - name: PHPStan
        run: composer analyse

      - name: PHPUnit
        run: composer test

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: composer


      - name: Build the distributable plugin
        run: composer build

      - name: Extract the plugin
        run: |
          rm -rf build/check
          mkdir -p build/check
          unzip -q build/verifycate.zip -d build/check

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          slug: verifycate
          build-dir: build/check/verifycate
          exclude-directories: 'vendor'

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: composer


      - name: Build the distributable plugin zip
        run: composer build

      - name: Upload the plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: verifycate-plugin
          path: build/verifycate.zip
          if-no-files-found: error
