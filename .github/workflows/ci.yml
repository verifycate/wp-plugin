name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    name: Quality (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '7.4'
          - '8.0'
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - name: Check out the private PHP SDK
        run: |
          if [ -z "${{ secrets.VERIFYCATE_SDK_TOKEN }}" ]; then
            echo "::error::VERIFYCATE_SDK_TOKEN is not set. Add a read-only token for verifycate/php-sdk."
            exit 1
          fi
          git clone --depth=1 \
            "https://x-access-token:${{ secrets.VERIFYCATE_SDK_TOKEN }}@github.com/verifycate/php-sdk.git" \
            ../php-sdk

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: PHPCS (WordPress + PHPCompatibility)
        run: composer lint

      - name: PHPStan
        run: composer analyse

      - name: PHPUnit
        run: composer test

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: composer

      - name: Check out the private PHP SDK
        run: |
          if [ -z "${{ secrets.VERIFYCATE_SDK_TOKEN }}" ]; then
            echo "::error::VERIFYCATE_SDK_TOKEN is not set. Add a read-only token for verifycate/php-sdk."
            exit 1
          fi
          git clone --depth=1 \
            "https://x-access-token:${{ secrets.VERIFYCATE_SDK_TOKEN }}@github.com/verifycate/php-sdk.git" \
            ../php-sdk

      - name: Install production autoloader
        run: composer install --prefer-dist --no-progress --no-dev

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          slug: verifycate
          build-directory: '.'
          exclude-directories: 'vendor,node_modules,tests,.github,bin,build'

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: composer

      - name: Check out the private PHP SDK
        run: |
          if [ -z "${{ secrets.VERIFYCATE_SDK_TOKEN }}" ]; then
            echo "::error::VERIFYCATE_SDK_TOKEN is not set. Add a read-only token for verifycate/php-sdk."
            exit 1
          fi
          git clone --depth=1 \
            "https://x-access-token:${{ secrets.VERIFYCATE_SDK_TOKEN }}@github.com/verifycate/php-sdk.git" \
            ../php-sdk

      - name: Build the distributable plugin zip
        run: composer build

      - name: Upload the plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: verifycate-plugin
          path: build/verifycate.zip
          if-no-files-found: error
